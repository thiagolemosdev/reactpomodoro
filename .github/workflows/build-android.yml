name: Build Android APK

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version for release (ex: v1.0.0). Leave empty for artifact only.'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node / JS ──────────────────────────────────────────────────────────
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      # ── 3. React build ────────────────────────────────────────────────────────
      - name: Build web app
        run: npm run build

      - name: Verify dist/
        run: ls dist/ && ls dist/assets/

      # ── 4. Java ───────────────────────────────────────────────────────────────
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 5. Android SDK ────────────────────────────────────────────────────────
      - name: Show pre-installed Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- Platforms ---"
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "no platforms dir"
          echo "--- Build-tools ---"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "no build-tools dir"
          echo "--- cmdline-tools ---"
          ls "$ANDROID_HOME/cmdline-tools/" 2>/dev/null || echo "no cmdline-tools dir"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Install SDK 35 if missing
        run: |
          SDKMANAGER=""
          for p in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/11.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/10.0/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -f "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found — relying on pre-installed SDK"
          else
            echo "Using sdkmanager: $SDKMANAGER"
            "$SDKMANAGER" --list_installed 2>&1 | head -30 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" --sdk_root="$ANDROID_HOME" || true
          fi
          # Verify platform-35 is present
          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "OK: android-35 platform present"
          else
            echo "ERROR: android-35 platform missing — trying sdkmanager again without --sdk_root"
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" 2>&1 || true
          fi

      # ── 6. Copy web assets into android/ ─────────────────────────────────────
      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/. android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # ── 7. Build debug APK ────────────────────────────────────────────────────
      - name: Build debug APK
        id: gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee /tmp/gradle-build.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ── 8. Upload Gradle log (always — even on failure) ───────────────────────
      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      # ── 9. Rename APK with version ────────────────────────────────────────────
      - name: Prepare APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
          elif [[ "${{ inputs.version }}" != "" ]]; then
            VER="${{ inputs.version }}"
          else
            VER="debug-$(date +%Y%m%d-%H%M)"
          fi
          DEST="CosmicFocus-${VER}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST"    >> "$GITHUB_OUTPUT"
          echo "name=$DEST"    >> "$GITHUB_OUTPUT"
          echo "version=$VER"  >> "$GITHUB_OUTPUT"

      # ── 10. Upload APK artifact ───────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ── 11. GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.version }}
          name: CosmicFocus ${{ steps.apk.outputs.version }}
          body: |
            ## CosmicFocus ${{ steps.apk.outputs.version }}

            ### Como instalar no Android

            1. Baixe **${{ steps.apk.outputs.name }}** abaixo
            2. No Android: **Configurações → Segurança → Fontes desconhecidas** → ative
            3. Abra o APK e instale

            > Requer Android 7.0 (API 24) ou superior.
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
