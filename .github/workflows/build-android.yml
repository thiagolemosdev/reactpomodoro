name: Build Android APK

on:
  # Debug APK artifact on every push to main
  push:
    branches: [main]
    # Release APK on version tags — usage: git tag v1.0.0 && git push origin v1.0.0
    tags:
      - 'v*.*.*'

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the APK?'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ─── Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Node.js ────────────────────────────────────────────────────────────
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ─── Build web app ──────────────────────────────────────────────────────
      - name: Build web app (React + Vite)
        run: npm run build

      # ─── Java & Android SDK ─────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ─── Capacitor sync ─────────────────────────────────────────────────────
      - name: Sync Capacitor (copy web assets → android/)
        run: npx cap sync android

      # ─── Keystore (release signing — optional) ──────────────────────────────
      # Only runs when KEYSTORE_BASE64 secret is set in repo settings.
      # Without it, the debug keystore is used automatically.
      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      # ─── Build APK ──────────────────────────────────────────────────────────
      - name: Build debug APK
        if: ${{ env.KEYSTORE_BASE64 == '' || env.KEYSTORE_BASE64 == null }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK (signed)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon

      # ─── Locate & rename APK ────────────────────────────────────────────────
      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v* ]]; then
            DEST="CosmicFocus-${VERSION}.apk"
          else
            DEST="CosmicFocus-debug-$(date +%Y%m%d-%H%M).apk"
          fi
          cp "$APK" "$DEST"
          echo "path=$DEST" >> $GITHUB_OUTPUT
          echo "name=$DEST" >> $GITHUB_OUTPUT

      # ─── Upload artifact (every build) ──────────────────────────────────────
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ─── GitHub Release (tag pushes only) ───────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 'CosmicFocus ${{ github.ref_name }}'
          body: |
            ## 🌌 CosmicFocus ${{ github.ref_name }}

            ### Como instalar no Android

            1. Baixe o arquivo **${{ steps.apk.outputs.name }}** abaixo
            2. No Android, vá em **Configurações → Segurança → Fontes desconhecidas**
            3. Ative a permissão para o seu navegador ou gerenciador de arquivos
            4. Abra o APK baixado e instale

            > **Requisito mínimo**: Android 7.0 (API 24) ou superior

            ---

            ### Novidades desta versão
            - ⏱️ Timer Pomodoro com seleção de objetivos por categoria
            - 🎯 Metas diárias com progress bars e agenda (acordar/dormir)
            - 🛡️ FocusGuard: sair do app por +10s cancela o Pomodoro
            - 🌌 Universo: cada Pomodoro concluído vira uma estrela
            - 📜 Histórico completo dos ciclos com tag de objetivo
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
