name: Build Android APK

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*.*.*'

  # Manual trigger: Actions tab → Build Android APK → Run workflow
  # Fill "version" (ex: v1.0.0) to also create a GitHub Release
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for release (ex: v1.0.0). Leave empty for artifact only.'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source code ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node / JS deps ─────────────────────────────────────────────────────
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      # ── 3. Build React app ────────────────────────────────────────────────────
      - name: Build web app
        run: npm run build

      - name: Verify dist/
        run: ls -la dist/ dist/assets/

      # ── 4. Java / Android SDK ─────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Capacitor: copy web assets into android/ ──────────────────────────
      - name: Capacitor sync
        run: npx cap sync android
        env:
          CI: true

      # ── 6. Build debug APK ────────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 7. Rename APK with version ────────────────────────────────────────────
      - name: Prepare APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
          elif [[ "${{ inputs.version }}" != "" ]]; then
            VER="${{ inputs.version }}"
          else
            VER="debug-$(date +%Y%m%d-%H%M)"
          fi
          DEST="CosmicFocus-${VER}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$DEST"  >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # ── 8. Upload artifact (always) ───────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ── 9. GitHub Release (on tag OR manual with version filled) ─────────────
      - name: Create GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.version }}
          name: CosmicFocus ${{ steps.apk.outputs.version }}
          body: |
            ## 🌌 CosmicFocus ${{ steps.apk.outputs.version }}

            ### Como instalar no Android

            1. Baixe **${{ steps.apk.outputs.name }}** abaixo
            2. No Android: **Configurações → Segurança → Fontes desconhecidas** → ative
            3. Abra o APK baixado e clique em Instalar

            > Requer Android 7.0 (API 24) ou superior.

            ---

            **Fase 1 inclui:**
            - ⏱️ Timer Pomodoro com objetivos por categoria
            - 🎯 Metas diárias com progress bars e agenda
            - 🛡️ FocusGuard — sair do app cancela o Pomodoro
            - 🌌 Universo — cada Pomodoro vira uma estrela
            - 📜 Histórico completo
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
