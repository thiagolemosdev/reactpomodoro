name: Build Android APK

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*.*.*'

  # Manual trigger — go to Actions tab → Build Android APK → Run workflow
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (ex: v1.0.0). Leave empty for debug artifact only.'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app (React + Vite)
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor (copy web assets → android/)
        run: npx cap sync android

      # ─── Keystore (signed release — optional) ───────────────────────────────
      # Configure these secrets in repo Settings → Secrets for a signed APK.
      # Without them, a debug APK is built automatically.
      - name: Decode release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build debug APK
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK (signed)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon

      # ─── Determine version string ────────────────────────────────────────────
      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.version }}" != "" ]]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=debug-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          fi

      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          DEST="CosmicFocus-${{ steps.version.outputs.value }}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> $GITHUB_OUTPUT
          echo "name=$DEST" >> $GITHUB_OUTPUT

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ─── GitHub Release ──────────────────────────────────────────────────────
      # Runs when: a v*.*.* tag is pushed, OR workflow_dispatch with a version set
      - name: Create GitHub Release
        if: >
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: 'CosmicFocus ${{ steps.version.outputs.value }}'
          body: |
            ## 🌌 CosmicFocus ${{ steps.version.outputs.value }}

            ### Como instalar no Android

            1. Baixe o arquivo **${{ steps.apk.outputs.name }}** abaixo
            2. No Android vá em **Configurações → Segurança → Fontes desconhecidas**
            3. Ative a permissão para o gerenciador de arquivos ou navegador
            4. Abra o APK e instale

            > **Requisito mínimo**: Android 7.0 (API 24) ou superior

            ---

            ### O que tem nessa versão
            - ⏱️ Timer Pomodoro com seleção de objetivos por categoria
            - 🎯 Metas diárias com progress bars e agenda (acordar/dormir)
            - 🛡️ FocusGuard: sair do app por +10s cancela o Pomodoro
            - 🌌 Universo: cada Pomodoro concluído vira uma estrela
            - 📜 Histórico completo dos ciclos
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
